[model]
version = "corner-dual-v0.2"
train_start = "2015-01-01"
max_count = 40
random_seed = 42

[catboost]
loss_function = "Poisson"
iterations = 700
depth = 5
learning_rate = 0.03
l2_leaf_reg = 10.0
random_seed = 42
verbose = false
allow_writing_files = false
thread_count = 4

[strengths]
shrinkage_games = 8.0
min_rate = 0.35
max_rate = 2.50

[betting]
edge_threshold = 0.05
ev_threshold = 0.05
max_bets_per_match = 1

[validation]
folds = [
  ["2022-08-01", "2023-08-01", "2022/23"],
  ["2023-08-01", "2024-08-01", "2023/24"],
  ["2024-08-01", "2025-08-01", "2024/25"],
]
reference_start = "2025-08-01"
